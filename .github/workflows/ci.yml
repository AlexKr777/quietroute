name: CI

on:
  push:
    branches: [main, portfolio-polish]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuietRouteDesktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ..
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run site:build
